# keymap-drawer config: readable labels for the Ferris keymap.
# Usage: see README "Drawing the layout".
parse_config:
  # Whole bindings (behavior + params) → label
  raw_binding_map:
    "&shift_td": { t: "⇧ 1×", h: "2× caps" }
    "&spc_home": { t: "Space", h: "→ Base" }
    "&ent_home": { t: "Enter", h: "→ Base" }
    "&to BASE": "→ Base"
    "&to SYM": "→ Sym"
    "&to NAV": "→ Nav"
    "&to NUM": "→ Num"
    "&to MOUSE": "→ Mouse"
    "&kp RA(Q)": "ä"
    "&kp RA(W)": "å"
    "&kp RA(P)": "ö"
    "&kp RA(N5)": "€"
    "&kp LC(Z)": "Undo"
    "&kp LC(X)": "Cut"
    "&kp LC(C)": "Copy"
    "&kp LC(V)": "Paste"
    "&kp LC(LS(Z))": "Redo"
    "&kp LC(A)": "Sel all"
    "&kp LC(F)": "Find"
    "&kp LC(TAB)": "Next tab"
    "&kp LC(LS(TAB))": "Prev tab"
    "&kp LS(TAB)": "⇧ Tab"
    "&kp LS(LEFT)": "⇧ ←"
    "&kp LS(DOWN)": "⇧ ↓"
    "&kp LS(UP)": "⇧ ↑"
    "&kp LS(RIGHT)": "⇧ →"
    "&kp PSCRN": "PrtSc"
    "&mkp LCLK": "L click"
    "&mkp MCLK": "M click"
    "&mkp RCLK": "R click"
    "&mkp MB4": "Back"
    "&mkp MB5": "Fwd"
    "&mmv MOVE_LEFT": "🖰 ←"
    "&mmv MOVE_DOWN": "🖰 ↓"
    "&mmv MOVE_UP": "🖰 ↑"
    "&mmv MOVE_RIGHT": "🖰 →"
    "&msc SCRL_LEFT": "Scroll ←"
    "&msc SCRL_DOWN": "Scroll ↓"
    "&msc SCRL_UP": "Scroll ↑"
    "&msc SCRL_RIGHT": "Scroll →"
    "&sk LGUI": "GUI"
    "&sk RGUI": "GUI"
    "&sk LALT": "Alt"
    "&sk LCTRL": "Ctrl"
    "&sk RCTRL": "Ctrl"
  # Combo placement: thumb chords drawn under the thumbs so they don't cover labels.
  zmk_combos:
    combo_to_nav: { align: bottom, offset: 0.6 }
    combo_to_num: { align: bottom, offset: 0.6 }
  # Plain keycodes → label (this replaces keymap-drawer's built-in map, so list symbols too)
  zmk_keycode_map:
    SPACE: "Spc"
    RET: "Ent"
    GRAVE: "`"
    TILDE: "~"
    EXCL: "!"
    AT: "@"
    HASH: "#"
    DLLR: "$"
    PRCNT: "%"
    CARET: "^"
    AMPS: "&"
    STAR: "*"
    LPAR: "("
    RPAR: ")"
    MINUS: "-"
    UNDER: "_"
    EQUAL: "="
    PLUS: "+"
    LBKT: "["
    RBKT: "]"
    LBRC: "{"
    RBRC: "}"
    BSLH: "\\"
    PIPE: "|"
    SEMI: ";"
    COLON: ":"
    SQT: "'"
    DQT: "\""
    COMMA: ","
    DOT: "."
    LT: "<"
    GT: ">"
    FSLH: "/"
    QMARK: "?"
    ESC: "Esc"
    TAB: "Tab"
    DEL: "Del"
    BSPC: "⌫"
    LEFT: "←"
    DOWN: "↓"
    UP: "↑"
    RIGHT: "→"
    HOME: "Home"
    END: "End"
    PG_UP: "PgUp"
    PG_DN: "PgDn"
draw_config:
  # Knob presses sit in the module row; label them so the row isn't a mystery.
  dark_mode: auto
